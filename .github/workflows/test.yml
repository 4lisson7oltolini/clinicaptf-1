name: Testes Python

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Executar testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Atualizar pip
        run: |
          python -m pip install --upgrade pip

      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verificar estrutura do projeto
        run: |
          echo "Diretório atual:"
          pwd

          echo ""
          echo "Arquivos da raiz:"
          ls -la

          echo ""
          echo "Verificando utils.py:"
          test -f utils.py && echo "utils.py encontrado!" || echo "ERRO: utils.py não encontrado!"

      - name: Testar import do utils
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "import utils; print('Importação de utils.py: OK')"

      - name: Executar pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -v